name: mobile
description: "FloodAid - Nền tảng Hỗ trợ Điều phối Cứu trợ Lũ lụt"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  
  # HTTP & API
  http: ^1.6.0
  
  # GPS & Location
  geolocator: ^14.0.2
  
  # Local Storage
  shared_preferences: ^2.3.0
  
  # UI
  google_fonts: ^6.2.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.2
  
  # Speech to Text
  speech_to_text: ^7.0.0

  # Local Notifications (System-level, giống Messenger/MBBank)
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
